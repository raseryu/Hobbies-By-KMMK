<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>KMMK Admin — Dashboard</title>
    <meta
      name="description"
      content="Static admin dashboard UI for managing products, inventory, and orders for Hobbies by KMMK."
    />
    <link rel="icon" type="image/png" href="./logo-hobbies.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="app" id="app">
      <aside class="sidebar" aria-label="Administrative navigation">
        <div class="sidebar__brand">
          <div class="brandmark" aria-hidden="true">
            <img src="./logo-hobbies.png" alt="Hobbies by KMMK logo" class="brandmark__img" />
          </div>
          <div class="brandtext">
            <div class="brandtext__title">HOBBIES</div>
            <div class="brandtext__sub">by KMMK · Admin</div>
          </div>
        </div>

        <nav class="nav" id="nav">
          <a class="nav__item" href="#/dashboard" data-route="dashboard">
            <span class="nav__icon" aria-hidden="true">▦</span>
            <span class="nav__label">Dashboard overview</span>
          </a>
          <a class="nav__item" href="#/inventory" data-route="inventory">
            <span class="nav__icon" aria-hidden="true">⌗</span>
            <span class="nav__label">Inventory management</span>
          </a>
          <a class="nav__item" href="#/orders" data-route="orders">
            <span class="nav__icon" aria-hidden="true">⧉</span>
            <span class="nav__label">Orders & transactions</span>
          </a>
          <a class="nav__item" href="#/content" data-route="content">
            <span class="nav__icon" aria-hidden="true">✎</span>
            <span class="nav__label">Content / control forms</span>
          </a>
          <a class="nav__item" href="#/admin" data-route="admin" data-admin-only="true">
            <span class="nav__icon" aria-hidden="true">⚙</span>
            <span class="nav__label">Manage Admin</span>
          </a>
        </nav>

        <div class="sidebar__footer">
          <button class="btn btn--ghost" id="exportBtn" type="button">Export data</button>
          <label class="btn btn--ghost filebtn" for="importFile">
            Import data
            <input id="importFile" type="file" accept="application/json" />
          </label>
          <button class="btn btn--danger" id="resetBtn" type="button">Reset demo data</button>
        </div>
      </aside>

      <div class="shell">
        <header class="topbar">
          <button class="iconbtn" id="sidebarToggle" type="button" aria-label="Toggle navigation">
            <span aria-hidden="true">☰</span>
          </button>
          <div class="topbar__title" id="pageTitle">Dashboard</div>
          <div class="topbar__spacer"></div>
          <div class="topbar__meta">
            <div class="userchip-dropdown" id="adminUserDropdown">
              <button type="button" class="userchip userchip--trigger" id="adminUserTrigger" aria-expanded="false" aria-haspopup="true" aria-controls="adminUserMenu">
                <span class="avatar" aria-hidden="true">A</span>
                <span class="userchip__name">Administrator</span>
                <span class="userchip__chevron" aria-hidden="true">▼</span>
              </button>
              <div class="userchip-dropdown__menu" id="adminUserMenu" role="menu" hidden>
                <button type="button" class="userchip-dropdown__item" id="adminLogoutBtn" role="menuitem">Log out</button>
              </div>
            </div>
          </div>
        </header>

        <main class="main" id="main" tabindex="-1">
          <!-- Rendered by app.js -->
        </main>
      </div>
    </div>

    <div class="toasts" id="toasts" aria-live="polite" aria-relevant="additions"></div>

    <dialog class="dialog" id="modal">
      <form class="dialog__card" id="modalForm">
        <div class="dialog__header">
          <div class="dialog__title" id="modalTitle">Modal</div>
          <button class="iconbtn" id="modalClose" aria-label="Close dialog" type="button">
            <span aria-hidden="true">✕</span>
          </button>
        </div>
        <div class="dialog__body" id="modalBody"></div>
        <div class="dialog__footer" id="modalFooter"></div>
      </form>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = window.SUPABASE_URL || "https://uwepasmiacrtsnnovjlc.supabase.co";
      const SUPABASE_ANON_KEY =
        window.SUPABASE_ANON_KEY || "sb_publishable_slMeCPCCEE2KWXvdEgMRZA_TQAsm4gK";

      if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
        console.warn(
          "[admin-static] Supabase URL/anon key not configured. " +
            "Admin API features will be disabled until they are set."
        );
      }

      window.supabaseClient =
        typeof window.supabase !== "undefined" &&
        SUPABASE_URL &&
        SUPABASE_ANON_KEY
          ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
          : null;
    </script>
    <script src="./app.js"></script>
  </body>
</html>
